<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cod-ts playground</title>
    <script>
      // Apply a remembered theme before the page is drawn (see src/theme.ts).
      try {
        const theme = localStorage.getItem('cod-ts-playground-theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
    <script type="module" crossorigin src="./assets/index-Cemn40TB.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/rolldown-runtime-XKyaHtl9.js">
    <link rel="stylesheet" crossorigin href="./assets/index-BpcBPkA-.css">
  </head>
  <body>
    <header>
      <h1><span class="brand">cod-ts</span><span class="slash">/</span>playground</h1>
      <div class="actions">
        <label class="field">
          Example
          <select id="examples"></select>
        </label>
        <button id="share" class="iconbtn" title="Copy link" aria-label="Copy link">
          <svg class="icon icon-share" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12M7.5 7.5 12 3l4.5 4.5M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7" />
          </svg>
          <svg class="icon icon-check" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12.5 9.5 17 19 7.5" />
          </svg>
        </button>
        <button id="theme" class="iconbtn" title="Switch theme" aria-label="Switch theme">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z" />
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"
            />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section id="editor" aria-label="Code editor">
        <div id="loading">
          <div class="spinner"></div>
          Loading editor…
        </div>
      </section>

      <section class="right">
        <div class="panel-head preview-head">
          <span class="title">Preview</span>
          <label class="field check"><input type="checkbox" id="auto" /> Run on edit</label>
          <button id="run" class="smallbtn primary" title="Shift + Enter or Ctrl/Cmd + S">
            Run
          </button>
        </div>
        <iframe id="preview" title="Preview" sandbox="allow-scripts"></iframe>
        <div class="console">
          <div class="panel-head console-head">
            <span class="title">Console</span>
            <span id="diag"></span>
            <button id="clear" class="smallbtn">Clear</button>
          </div>
          <div id="log" role="log"></div>
        </div>
      </section>
    </main>

  </body>
</html>
